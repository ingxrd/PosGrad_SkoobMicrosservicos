server.port=${SERVER_PORT:8080}

# MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# URL do serviço remoto
registroleitura.service.url=${REGISTROLEITURA_SERVICE_URL}

# Timeouts do Feign
spring.cloud.openfeign.client.config.registro-leitura-service.connect-timeout=${FEIGN_CONNECT_TIMEOUT:2000}
spring.cloud.openfeign.client.config.registro-leitura-service.read-timeout=${FEIGN_READ_TIMEOUT:3000}