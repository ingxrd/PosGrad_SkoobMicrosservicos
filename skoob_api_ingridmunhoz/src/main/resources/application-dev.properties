server.port=8080

# Banco H2 (por enquanto, na Fase 3 trocamos para MySQL)
spring.datasource.url=jdbc:h2:mem:skoobdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# URL do serviço de registro de leitura (pode ser sobrescrita por variável de ambiente)
registroleitura.service.url=${REGISTROLEITURA_SERVICE_URL:http://localhost:8081}

# Timeouts do Feign
spring.cloud.openfeign.client.config.registro-leitura-service.connect-timeout=2000
spring.cloud.openfeign.client.config.registro-leitura-service.read-timeout=3000