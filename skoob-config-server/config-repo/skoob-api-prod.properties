server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

registroleitura.service.url=${REGISTROLEITURA_SERVICE_URL}

spring.cloud.openfeign.client.config.registro-leitura-service.connect-timeout=${FEIGN_CONNECT_TIMEOUT:2000}
spring.cloud.openfeign.client.config.registro-leitura-service.read-timeout=${FEIGN_READ_TIMEOUT:3000}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}